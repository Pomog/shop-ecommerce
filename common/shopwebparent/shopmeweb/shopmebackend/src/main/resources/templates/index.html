<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
      rel="stylesheet">
 
    <title>Shop Admin Panel</title>

    <!-- jQuery -->
    <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>

    <!-- Bootstrap JavaScript -->
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</head>
<body>

    <div class="container-fluid">
        <div>
            <h1 th:text="${#strings.isEmpty(message)} ? _ : ${message}">
                Welcome to the Shop Admin Panel
            </h1>
        </div>

        <button class="btn btn-primary">
            Bootstrap Test
        </button>
    </div>

 
</body>
</html>
