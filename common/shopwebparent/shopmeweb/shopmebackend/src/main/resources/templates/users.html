<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">

    <title>Users</title>
    <!-- jQuery -->
    <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>

    <!-- Bootstrap JavaScript -->
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

    <style>
        body {
            --bs-gradient: linear-gradient(190deg,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0.1));
        }
    </style>

</head>

<body class="bg-black bg-gradient text-light min-vh-100">

    <div class="container-fluid">
        <div>
            <nav class="navbar navbar-expand-lg bg-black" data-bs-theme="dark">
                <a>
                    <img th:src="@{/images/NEL-1.png}" alt="Logo" class="navbar-brand" style="height: 80px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item" th:each="menuObject : ${adminMenu}">
                            <a class="nav-link active" th:href="@{${menuObject.url}}" th:text="${menuObject.name}">
                                Menu item
                            </a>
                        </li>
                    </ul>

                </div>

            </nav>

        </div>

        <main class="py-4">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1>Users</h1>
                    <a th:href="@{/users/new}" class="btn btn-primary">
                        Create New User
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table table-dark table-striped table-bordered align-middle table-hover">
                        <caption class="text-light">Registered users</caption>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Photo</th>
                                <th scope="col">Email</th>
                                <th scope="col">First name</th>
                                <th scope="col">Last name</th>
                                <th scope="col">Enabled</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${listUsers}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${#strings.isEmpty(user.photo) ? 'No photo' : user.photo}"></td>
                                <td th:text="${user.email}"></td>
                                <td th:text="${user.firstName}"></td>
                                <td th:text="${user.lastName}"></td>
                                <td th:text="${user.enabled ? 'Yes' : 'No'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listUsers)}">
                                <td colspan="6" class="text-center">No users found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
